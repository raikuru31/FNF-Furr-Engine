name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;21.4.7075529" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y || true
          sudo apt-get update
          sudo apt-get install -y haxe
          haxe --version

      - name: Haxelibs
        run: |
          haxelib setup "$HOME/haxelib"
          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.2.2
          haxelib install tjson 1.4.0
          haxelib install hscript
          haxelib install flxanimate
          haxelib git funkin.vis https://github.com/FunkinCrew/funkin.vis || true
          haxelib git grig.audio https://github.com/FunkinCrew/grig.audio || true

      - name: Build APK
        run: haxelib run lime build android -release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FurrEngine-android
          path: export/release/android/bin/**/*.apk
